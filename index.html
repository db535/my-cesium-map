<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>VR風 洪水避難ゲーム</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.136/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.136/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
    }

    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 330px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(5, 10, 18, 0.86);
      color: white;
      box-shadow: 0 16px 50px rgba(0,0,0,0.5);
    }

    #hud h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    #hud p {
      margin: 6px 0;
      font-size: 13px;
      line-height: 1.5;
      color: rgba(255,255,255,0.85);
    }

    #waterMeter {
      margin-top: 12px;
      height: 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      overflow: hidden;
    }

    #waterBar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00c8ff, #226cff, #ff3333);
    }

    #status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      font-size: 14px;
      line-height: 1.6;
    }

    #centerMessage {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #messageBox {
      width: min(620px, calc(100vw - 36px));
      padding: 30px;
      border-radius: 26px;
      background: rgba(4, 8, 15, 0.9);
      color: white;
      text-align: center;
      box-shadow: 0 20px 70px rgba(0,0,0,0.65);
    }

    #messageBox h2 {
      margin: 0 0 12px;
      font-size: 30px;
    }

    #messageBox p {
      line-height: 1.7;
      color: rgba(255,255,255,0.85);
    }

    button {
      margin-top: 16px;
      padding: 13px 22px;
      border: none;
      border-radius: 999px;
      background: #2f80ed;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: #1d6fd2;
    }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      z-index: 9;
      pointer-events: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: white;
      box-shadow: 0 0 8px black;
    }

    #crosshair::before {
      width: 22px;
      height: 2px;
      left: 0;
      top: 10px;
    }

    #crosshair::after {
      width: 2px;
      height: 22px;
      left: 10px;
      top: 0;
    }

    #controls {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 11;
      display: grid;
      grid-template-columns: 58px 58px 58px;
      grid-template-rows: 58px 58px;
      gap: 8px;
    }

    .pad {
      border: none;
      border-radius: 18px;
      background: rgba(255,255,255,0.18);
      color: white;
      font-size: 22px;
      font-weight: 900;
      touch-action: none;
    }

    .pad:active {
      background: rgba(47,128,237,0.8);
    }

    #up { grid-column: 2; grid-row: 1; }
    #left { grid-column: 1; grid-row: 2; }
    #down { grid-column: 2; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }

    #lookControls {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 11;
      display: grid;
      grid-template-columns: 58px 58px 58px;
      grid-template-rows: 58px 58px;
      gap: 8px;
    }

    #lookUp { grid-column: 2; grid-row: 1; }
    #lookLeft { grid-column: 1; grid-row: 2; }
    #lookDown { grid-column: 2; grid-row: 2; }
    #lookRight { grid-column: 3; grid-row: 2; }

    #debug {
      position: absolute;
      right: 16px;
      top: 16px;
      z-index: 10;
      padding: 12px;
      border-radius: 14px;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>

  <div id="hud">
    <h1>VR風 洪水避難ゲーム</h1>
    <p>水が上がる前に、青い避難タワーまで逃げてください。</p>
    <p>PC：WASD / 矢印キー + マウス視点<br>スマホ：下のボタン</p>

    <div id="waterMeter">
      <div id="waterBar"></div>
    </div>

    <div id="status">
      時間：<span id="timeText">0.0</span> 秒<br>
      水位：<span id="waterText">0.0</span> m<br>
      ゴールまで：<span id="distanceText">---</span> m<br>
      状態：<span id="stateText">待機中</span>
    </div>
  </div>

  <div id="debug">
    画面クリック：マウス視点操作<br>
    青い円柱：避難タワー<br>
    半透明の青：洪水エリア
  </div>

  <div id="crosshair"></div>

  <div id="controls">
    <button class="pad" id="up">▲</button>
    <button class="pad" id="left">◀</button>
    <button class="pad" id="down">▼</button>
    <button class="pad" id="right">▶</button>
  </div>

  <div id="lookControls">
    <button class="pad" id="lookUp">↑</button>
    <button class="pad" id="lookLeft">←</button>
    <button class="pad" id="lookDown">↓</button>
    <button class="pad" id="lookRight">→</button>
  </div>

  <div id="centerMessage">
    <div id="messageBox">
      <h2>水が来る。逃げろ。</h2>
      <p>
        あなたは洪水警報が出た街にいます。<br>
        水位が上がる前に、青い避難タワーへ逃げてください。
      </p>
      <p>
        操作：WASD / 矢印キーで移動、マウスで視点変更。
      </p>
      <button id="startButton">開始する</button>
    </div>
  </div>

  <script>
    // =========================
    // Cesium 初期化
    // =========================
    const viewer = new Cesium.Viewer("cesiumContainer", {
      animation: false,
      timeline: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      baseLayerPicker: false,
      navigationHelpButton: false,
      infoBox: false,
      selectionIndicator: false,
      fullscreenButton: true,
      vrButton: true,
      shouldAnimate: true
    });

    viewer.scene.globe.depthTestAgainstTerrain = true;

    // 自前FPS操作にするため、標準カメラ操作をOFF
    viewer.scene.screenSpaceCameraController.enableRotate = false;
    viewer.scene.screenSpaceCameraController.enableTranslate = false;
    viewer.scene.screenSpaceCameraController.enableZoom = false;
    viewer.scene.screenSpaceCameraController.enableTilt = false;
    viewer.scene.screenSpaceCameraController.enableLook = false;

    // =========================
    // ゲーム状態
    // =========================
    const startLon = 138.2492;
    const startLat = 36.4023;
    const goalLon = 138.2548;
    const goalLat = 36.4071;

    let playerLon = startLon;
    let playerLat = startLat;
    let playerHeight = 2.0;

    let heading = Cesium.Math.toRadians(40);
    let pitch = Cesium.Math.toRadians(-4);

    let gameStarted = false;
    let gameOver = false;
    let gameClear = false;

    let elapsedSec = 0;
    let waterHeight = 0;

    const walkSpeed = 3.4;
    const maxWaterHeight = 4.6;
    const dangerWaterHeight = 1.1;
    const goalRadiusMeters = 28;

    const keys = {};
    const pad = {};

    const centerMessage = document.getElementById("centerMessage");
    const messageBox = document.getElementById("messageBox");
    const startButton = document.getElementById("startButton");

    const timeText = document.getElementById("timeText");
    const waterText = document.getElementById("waterText");
    const distanceText = document.getElementById("distanceText");
    const stateText = document.getElementById("stateText");
    const waterBar = document.getElementById("waterBar");

    // =========================
    // シーン作成
    // =========================
    createWorld();
    setCamera();

    function createWorld() {
      // 地面
      viewer.entities.add({
        polygon: {
          hierarchy: Cesium.Cartesian3.fromDegreesArray([
            138.2440, 36.3975,
            138.2610, 36.3975,
            138.2610, 36.4120,
            138.2440, 36.4120
          ]),
          material: Cesium.Color.fromBytes(35, 48, 42, 230),
          outline: true,
          outlineColor: Cesium.Color.WHITE.withAlpha(0.25)
        }
      });

      // 道
      addRoad([
        [138.2460, 36.3990],
        [138.2492, 36.4023],
        [138.2522, 36.4044],
        [138.2548, 36.4071]
      ], Cesium.Color.LIME.withAlpha(0.95), 6);

      addRoad([
        [138.2460, 36.3990],
        [138.2492, 36.4023],
        [138.2522, 36.4044],
        [138.2548, 36.4071]
      ], Cesium.Color.fromBytes(70, 70, 70, 255), 18);

      addRoad([
        [138.2470, 36.4068],
        [138.2502, 36.4049],
        [138.2558, 36.4032]
      ], Cesium.Color.fromBytes(65, 65, 65, 255), 12);

      addRoad([
        [138.2515, 36.3988],
        [138.2512, 36.4022],
        [138.2515, 36.4078]
      ], Cesium.Color.fromBytes(65, 65, 65, 255), 12);

      // 建物
      const buildings = [
        [138.2470, 36.4000, 20, 24, 24, 0],
        [138.2487, 36.4008, 12, 22, 32, 20],
        [138.2506, 36.4016, 28, 20, 22, 40],
        [138.2522, 36.4025, 18, 32, 20, 15],
        [138.2538, 36.4036, 24, 22, 28, 45],
        [138.2555, 36.4048, 16, 30, 22, 10],
        [138.2480, 36.4052, 22, 22, 22, 0],
        [138.2504, 36.4064, 30, 22, 28, 35],
        [138.2528, 36.4070, 18, 25, 20, 20],
        [138.2565, 36.4068, 28, 24, 24, 50],
        [138.2470, 36.4082, 16, 30, 18, 10],
        [138.2497, 36.4090, 24, 22, 22, 25],
        [138.2526, 36.4093, 20, 30, 22, 5],
        [138.2573, 36.4087, 26, 22, 26, 40]
      ];

      buildings.forEach((b, i) => {
        addBuilding(...b, i);
      });

      // 避難タワー
      viewer.entities.add({
        name: "避難タワー",
        position: Cesium.Cartesian3.fromDegrees(goalLon, goalLat, 22),
        cylinder: {
          length: 44,
          topRadius: 8,
          bottomRadius: 8,
          material: Cesium.Color.ROYALBLUE.withAlpha(0.96),
          outline: true,
          outlineColor: Cesium.Color.WHITE
        },
        label: {
          text: "避難タワー",
          font: "bold 20px sans-serif",
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 4,
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          pixelOffset: new Cesium.Cartesian2(0, -60)
        }
      });

      viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(goalLon, goalLat, 48),
        ellipsoid: {
          radii: new Cesium.Cartesian3(22, 22, 22),
          material: Cesium.Color.CYAN.withAlpha(0.22),
          outline: true,
          outlineColor: Cesium.Color.CYAN
        }
      });

      // 洪水
      const floodPolygon = [
        138.2452, 36.3984,
        138.2590, 36.3985,
        138.2600, 36.4055,
        138.2564, 36.4106,
        138.2472, 36.4098,
        138.2446, 36.4042
      ];

      viewer.entities.add({
        name: "洪水",
        polygon: {
          hierarchy: Cesium.Cartesian3.fromDegreesArray(floodPolygon),
          height: new Cesium.CallbackProperty(() => waterHeight, false),
          extrudedHeight: 0,
          material: new Cesium.ColorMaterialProperty(
            new Cesium.CallbackProperty(() => {
              const pulse = 0.45 + Math.sin(performance.now() * 0.004) * 0.08;
              return new Cesium.Color(0.02, 0.38, 0.9, pulse);
            }, false)
          ),
          outline: true,
          outlineColor: Cesium.Color.CYAN
        }
      });

      // 水面の波線
      for (let i = 0; i < 12; i++) {
        viewer.entities.add({
          polyline: {
            positions: new Cesium.CallbackProperty(() => {
              const t = performance.now() * 0.001;
              const pts = [];
              const baseLat = 36.3992 + i * 0.0009;
              for (let k = 0; k < 18; k++) {
                const lon = 138.2460 + k * 0.0007;
                const lat = baseLat + Math.sin(k * 0.9 + t * 2 + i) * 0.00008;
                pts.push(lon, lat, waterHeight + 0.15);
              }
              return Cesium.Cartesian3.fromDegreesArrayHeights(pts);
            }, false),
            width: 2,
            material: Cesium.Color.WHITE.withAlpha(0.25)
          }
        });
      }
    }

    function addRoad(points, color, width) {
      viewer.entities.add({
        polyline: {
          positions: Cesium.Cartesian3.fromDegreesArray(points.flat()),
          width,
          clampToGround: true,
          material: color
        }
      });
    }

    function addBuilding(lon, lat, height, x, y, rot, index) {
      const pos = Cesium.Cartesian3.fromDegrees(lon, lat, height / 2);
      const hpr = new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(rot), 0, 0);

      const colors = [
        Cesium.Color.fromBytes(145, 145, 140, 245),
        Cesium.Color.fromBytes(120, 135, 150, 245),
        Cesium.Color.fromBytes(155, 130, 110, 245),
        Cesium.Color.fromBytes(100, 110, 120, 245)
      ];

      viewer.entities.add({
        position: pos,
        orientation: Cesium.Transforms.headingPitchRollQuaternion(pos, hpr),
        box: {
          dimensions: new Cesium.Cartesian3(x, y, height),
          material: colors[index % colors.length],
          outline: true,
          outlineColor: Cesium.Color.WHITE.withAlpha(0.35)
        }
      });
    }

    // =========================
    // 入力
    // =========================
    window.addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;
    });

    window.addEventListener("keyup", e => {
      keys[e.key.toLowerCase()] = false;
    });

    document.body.addEventListener("click", () => {
      if (gameStarted && !gameOver && !gameClear) {
        document.body.requestPointerLock?.();
      }
    });

    document.addEventListener("mousemove", e => {
      if (document.pointerLockElement === document.body) {
        heading += e.movementX * 0.0022;
        pitch -= e.movementY * 0.0018;
        pitch = clamp(pitch, Cesium.Math.toRadians(-45), Cesium.Math.toRadians(18));
      }
    });

    bindPad("up", "forward");
    bindPad("down", "back");
    bindPad("left", "left");
    bindPad("right", "right");

    bindPad("lookUp", "lookUp");
    bindPad("lookDown", "lookDown");
    bindPad("lookLeft", "lookLeft");
    bindPad("lookRight", "lookRight");

    function bindPad(id, name) {
      const el = document.getElementById(id);

      el.addEventListener("pointerdown", e => {
        e.preventDefault();
        pad[name] = true;
      });

      el.addEventListener("pointerup", e => {
        e.preventDefault();
        pad[name] = false;
      });

      el.addEventListener("pointercancel", e => {
        e.preventDefault();
        pad[name] = false;
      });

      el.addEventListener("pointerleave", e => {
        e.preventDefault();
        pad[name] = false;
      });
    }

    startButton.addEventListener("click", startGame);

    // =========================
    // ゲームループ
    // =========================
    let last = performance.now();

    viewer.clock.onTick.addEventListener(() => {
      const now = performance.now();
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;

      if (!gameStarted || gameOver || gameClear) {
        setCamera();
        updateHud();
        return;
      }

      elapsedSec += dt;

      // 水位上昇
      waterHeight = Math.min(maxWaterHeight, 0.10 * elapsedSec + 0.0065 * elapsedSec * elapsedSec);

      updateLook(dt);
      updatePlayer(dt);
      setCamera();
      checkState();
      updateHud();
    });

    function startGame() {
      gameStarted = true;
      gameOver = false;
      gameClear = false;

      elapsedSec = 0;
      waterHeight = 0;

      playerLon = startLon;
      playerLat = startLat;
      heading = Cesium.Math.toRadians(40);
      pitch = Cesium.Math.toRadians(-4);

      centerMessage.style.display = "none";

      setTimeout(() => {
        document.body.requestPointerLock?.();
      }, 100);
    }

    function updateLook(dt) {
      const s = 1.9 * dt;

      if (pad.lookLeft) heading -= s;
      if (pad.lookRight) heading += s;
      if (pad.lookUp) pitch += s * 0.55;
      if (pad.lookDown) pitch -= s * 0.55;

      pitch = clamp(pitch, Cesium.Math.toRadians(-45), Cesium.Math.toRadians(18));
    }

    function updatePlayer(dt) {
      let f = 0;
      let r = 0;

      if (keys["w"] || keys["arrowup"] || pad.forward) f += 1;
      if (keys["s"] || keys["arrowdown"] || pad.back) f -= 1;
      if (keys["a"] || keys["arrowleft"] || pad.left) r -= 1;
      if (keys["d"] || keys["arrowright"] || pad.right) r += 1;

      const len = Math.hypot(f, r);
      if (len > 0) {
        f /= len;
        r /= len;
      }

      const move = walkSpeed * dt;

      const north = move * (f * Math.cos(heading) - r * Math.sin(heading));
      const east = move * (f * Math.sin(heading) + r * Math.cos(heading));

      const mLat = 111320;
      const mLon = 111320 * Math.cos(Cesium.Math.toRadians(playerLat));

      playerLat += north / mLat;
      playerLon += east / mLon;

      playerLon = clamp(playerLon, 138.2445, 138.2605);
      playerLat = clamp(playerLat, 36.3980, 36.4115);
    }

    function setCamera() {
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(playerLon, playerLat, playerHeight),
        orientation: {
          heading,
          pitch,
          roll: 0
        }
      });
    }

    function checkState() {
      const d = distanceMeters(playerLon, playerLat, goalLon, goalLat);
      const inFlood = isInFloodArea(playerLon, playerLat);

      if (d <= goalRadiusMeters) {
        gameClear = true;
        gameStarted = false;
        document.exitPointerLock?.();

        centerMessage.style.display = "flex";
        messageBox.innerHTML = `
          <h2>避難成功！</h2>
          <p>水位 ${waterHeight.toFixed(1)} m の時点で避難タワーに到着しました。</p>
          <button onclick="location.reload()">もう一度遊ぶ</button>
        `;
      }

      if (inFlood && waterHeight >= dangerWaterHeight) {
        gameOver = true;
        gameStarted = false;
        document.exitPointerLock?.();

        centerMessage.style.display = "flex";
        messageBox.innerHTML = `
          <h2>避難失敗</h2>
          <p>浸水エリア内で水位が ${waterHeight.toFixed(1)} m に達しました。</p>
          <button onclick="location.reload()">もう一度挑戦する</button>
        `;
      }
    }

    function updateHud() {
      const d = distanceMeters(playerLon, playerLat, goalLon, goalLat);

      timeText.textContent = elapsedSec.toFixed(1);
      waterText.textContent = waterHeight.toFixed(1);
      distanceText.textContent = d.toFixed(0);

      waterBar.style.width = `${Math.min(100, waterHeight / maxWaterHeight * 100)}%`;

      if (gameClear) {
        stateText.textContent = "避難成功";
        stateText.style.color = "#72ff95";
      } else if (gameOver) {
        stateText.textContent = "危険";
        stateText.style.color = "#ff6666";
      } else if (gameStarted) {
        if (isInFloodArea(playerLon, playerLat) && waterHeight > 0.4) {
          stateText.textContent = "浸水域内。急げ";
          stateText.style.color = "#ffd966";
        } else {
          stateText.textContent = "避難中";
          stateText.style.color = "white";
        }
      } else {
        stateText.textContent = "待機中";
        stateText.style.color = "white";
      }
    }

    function isInFloodArea(lon, lat) {
      return lon > 138.245 && lon < 138.260 && lat > 36.398 && lat < 36.4108;
    }

    function distanceMeters(lon1, lat1, lon2, lat2) {
      const R = 6371000;
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *
        Math.sin(dLon / 2) ** 2;

      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }
  </script>
</body>
</html>
