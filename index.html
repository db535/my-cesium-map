<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Japan 3D Map</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script type="module">
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI3MzM4NTMxNi0yYzYwLTRiN2ItYTIzYi0zNzJmZGFhODM5YjMiLCJpZCI6NDI0NjU3LCJpYXQiOjE3NzczNjI0NjZ9.aE_eNCYaVxPso_bdxpBmdSlEt_N0QJH_sa7gXwfZYT8';

    const viewer = new Cesium.Viewer('cesiumContainer');

    // Japan Regional Terrain（日本専用高精度地形）
    viewer.scene.setTerrain(
      new Cesium.Terrain(
        Cesium.CesiumTerrainProvider.fromIonAssetId(2767062),
      )
    );

    // Japan 3D Buildings（Plateau）
    const plateauTileset = viewer.scene.primitives.add(
      await Cesium.Cesium3DTileset.fromIonAssetId(2602291)
    );

    // Cesium OSM Buildings（上田市など未カバー地域を補完）
    const osmTileset = viewer.scene.primitives.add(
      await Cesium.Cesium3DTileset.fromIonAssetId(96188)
    );

    // 上田市にカメラを移動
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(138.2489, 36.4018, 3000),
      orientation: {
        heading: Cesium.Math.toRadians(0),
        pitch: Cesium.Math.toRadians(-45),
        roll: 0
      }
    });
  </script>
</body>
</html>
