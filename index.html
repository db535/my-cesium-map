<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>上田市 洪水シミュレーション</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(10, 20, 40, 0.85);
      color: white;
      padding: 18px;
      border-radius: 10px;
      z-index: 999;
      width: 280px;
      font-family: sans-serif;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #ui h2 { margin: 0 0 14px; font-size: 15px; border-bottom: 1px solid #4af; padding-bottom: 8px; }
    #ui label { font-size: 12px; color: #aaa; }
    #waterSlider { width: 100%; margin: 8px 0; accent-color: #4af; }
    #waterLevelDisplay { font-size: 28px; font-weight: bold; color: #4af; }
    #waterLevelUnit { font-size: 14px; color: #aaa; }
    .btn-row { display: flex; gap: 6px; margin-top: 10px; }
    button {
      flex: 1;
      padding: 7px 0;
      background: #1a3a5c;
      border: 1px solid #4af;
      border-radius: 5px;
      color: #4af;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }
    button:hover { background: #2a5a8c; }
    #legend { margin-top: 14px; border-top: 1px solid #333; padding-top: 10px; }
    #legend h3 { font-size: 11px; color: #aaa; margin: 0 0 6px; }
    .legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; font-size: 11px; }
    .legend-color { width: 20px; height: 12px; border-radius: 2px; }
    #status { margin-top: 10px; font-size: 11px; color: #888; text-align: center; }
    #vrBtn {
      width: 100%;
      margin-top: 8px;
      padding: 7px 0;
      background: #1a3a2c;
      border: 1px solid #4f8;
      border-radius: 5px;
      color: #4f8;
      cursor: pointer;
      font-size: 12px;
    }
    #vrBtn:hover { background: #2a5a3c; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <div id="ui">
    <h2>🌊 上田市 洪水シミュレーション</h2>

    <label>現在の水位</label>
    <div>
      <span id="waterLevelDisplay">0.0</span>
      <span id="waterLevelUnit"> m</span>
    </div>
    <input type="range" id="waterSlider" min="0" max="20" step="0.1" value="0">

    <div class="btn-row">
      <button id="btnPlay">▶ 再生</button>
      <button id="btnStop">⏸ 停止</button>
      <button id="btnReset">↺ リセット</button>
    </div>

    <button id="vrBtn">👁 一人称視点（VR）</button>

    <div id="legend">
      <h3>浸水深の凡例</h3>
      <div class="legend-item"><div class="legend-color" style="background:rgba(0,255,255,0.6)"></div>〜0.5m（床下浸水）</div>
      <div class="legend-item"><div class="legend-color" style="background:rgba(0,191,255,0.65)"></div>〜1.0m（床上浸水）</div>
      <div class="legend-item"><div class="legend-color" style="background:rgba(0,128,255,0.7)"></div>〜2.0m（1階水没）</div>
      <div class="legend-item"><div class="legend-color" style="background:rgba(0,64,255,0.75)"></div>〜5.0m（2階水没）</div>
      <div class="legend-item"><div class="legend-color" style="background:rgba(0,0,160,0.85)"></div>5.0m超（壊滅的）</div>
    </div>

    <div id="status">データ読み込み中...</div>
  </div>

  <script type="module">
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI3MzM4NTMxNi0yYzYwLTRiN2ItYTIzYi0zNzJmZGFhODM5YjMiLCJpZCI6NDI0NjU3LCJpYXQiOjE3NzczNjI0NjZ9.aE_eNCYaVxPso_bdxpBmdSlEt_N0QJH_sa7gXwfZYT8';

    // ビューワー初期化
    const viewer = new Cesium.Viewer('cesiumContainer', {
      terrainProvider: await Cesium.createWorldTerrainAsync({
        requestVertexNormals: true
      }),
      timeline: false,
      animation: false,
      baseLayerPicker: false,
      navigationHelpButton: false,
    });

    // 3D建物
    const plateauTileset = viewer.scene.primitives.add(
      await Cesium.Cesium3DTileset.fromIonAssetId(2602291)
    );
    const osmTileset = viewer.scene.primitives.add(
      await Cesium.Cesium3DTileset.fromIonAssetId(96188)
    );

    // 地形設定
    viewer.scene.globe.terrainExaggeration = 2.0;
    viewer.scene.globe.enableLighting = true;
    viewer.shadows = true;

    // 初期カメラ（上田市俯瞰）
    const DEFAULT_CAMERA = {
      destination: Cesium.Cartesian3.fromDegrees(138.2489, 36.4018, 5000),
      orientation: {
        heading: Cesium.Math.toRadians(0),
        pitch: Cesium.Math.toRadians(-45),
        roll: 0
      }
    };
    viewer.camera.flyTo(DEFAULT_CAMERA);

    // 水深に応じた色
    function depthToColor(depth) {
      if (depth <= 0.5) return Cesium.Color.fromBytes(0, 255, 255, 150);
      if (depth <= 1.0) return Cesium.Color.fromBytes(0, 191, 255, 165);
      if (depth <= 2.0) return Cesium.Color.fromBytes(0, 128, 255, 178);
      if (depth <= 5.0) return Cesium.Color.fromBytes(0, 64, 255, 191);
      return Cesium.Color.fromBytes(0, 0, 160, 216);
    }

    // GeoJSONファイル一覧（data/フォルダ内）
    const geojsonFiles = [
      'A31-20-21_8404030903.geojson',
      'A31-20-21_8404030001.geojson',
      'A31-20-21_8404030643.geojson',
      'A31-20-21_8404030649.geojson',
      'A31-20-21_8404030669.geojson',
      'A31-20-21_8404030677.geojson',
      'A31-20-21_8404030690.geojson',
      'A31-20-21_8404030693.geojson',
      'A31-20-21_8404030696.geojson',
      'A31-20-21_8404030698.geojson',
      'A31-20-21_8404030700.geojson',
      'A31-20-21_8404030904.geojson',
      'A31-20-21_8404030909.geojson',
      'A31-20-21_8404030913.geojson',
      'A31-20-21_8404030922.geojson',
      'A31-20-21_8404030923.geojson',
      'A31-20-21_8404030938.geojson',
      'A31-20-21_8404030963.geojson',
      'A31-20-21_8404030966.geojson',
      'A31-20-21_8404031041.geojson',
      'A31-20-21_8404050001.geojson',
      'A31-20-21_8404050048.geojson',
      'A31-20-21_8505050001.geojson',
      'A31-20-21_8505050124.geojson',
      'A31-20-21_8505050237.geojson',
      'A31-20-21_8505050356.geojson',
      'A31-20-21_8505050717.geojson',
      'A31-20-21_8505050720.geojson',
      'A31-20-21_8505050722.geojson',
      'A31-20-21_8505050731.geojson',
      'A31-20-21_8505090001.geojson',
      'A31-20-21_8404030705.geojson',
      'A31-20-21_8404030706.geojson',
      'A31-20-21_8404030877.geojson',
      'A31-20-21_8404030898.geojson',
    ];

    // 全エンティティを水深付きで保持
    const allEntities = []; // { entity, depth }
    const status = document.getElementById('status');

    let loaded = 0;
    for (const file of geojsonFiles) {
      try {
        const response = await fetch(`./data/${file}`);
        const geojson = await response.json();
        delete geojson.crs; // EPSG:6668はCesiumが未対応のため削除
        const ds = await Cesium.GeoJsonDataSource.load(geojson, {
          clampToGround: true,
        });

        for (const entity of ds.entities.values) {
          // 水深属性（A31_205が浸水深コード）
          const depthCode = entity.properties?.A31_205?.getValue() ?? 1;
          // コードを実際の水深(m)に変換
          const depthMap = { 1: 0.3, 2: 0.75, 3: 1.5, 4: 3.5, 5: 7.5 };
          const depth = depthMap[depthCode] ?? 1.0;

          entity.polygon.material = depthToColor(depth);
          entity.polygon.outline = false;
          entity.show = false; // 初期非表示

          allEntities.push({ entity, depth });
        }

        viewer.dataSources.add(ds);
        loaded++;
        status.textContent = `読み込み中... ${loaded}/${geojsonFiles.length}`;
      } catch (e) {
        // 読み込めないファイルはスキップ
      }
    }

    status.textContent = `✅ ${allEntities.length}件のデータ読み込み完了`;

    // 水位スライダー
    const slider = document.getElementById('waterSlider');
    const display = document.getElementById('waterLevelDisplay');

    function updateWaterLevel(level) {
      display.textContent = level.toFixed(1);
      for (const { entity, depth } of allEntities) {
        entity.show = depth <= level;
      }
    }

    slider.addEventListener('input', () => {
      updateWaterLevel(parseFloat(slider.value));
    });

    // 再生・停止・リセット
    let playInterval = null;

    document.getElementById('btnPlay').addEventListener('click', () => {
      if (playInterval) return;
      playInterval = setInterval(() => {
        const val = Math.min(parseFloat(slider.value) + 0.05, 20);
        slider.value = val;
        updateWaterLevel(val);
        if (val >= 20) {
          clearInterval(playInterval);
          playInterval = null;
        }
      }, 80);
    });

    document.getElementById('btnStop').addEventListener('click', () => {
      clearInterval(playInterval);
      playInterval = null;
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      clearInterval(playInterval);
      playInterval = null;
      slider.value = 0;
      updateWaterLevel(0);
    });

    // VR一人称視点
    let vrMode = false;
    document.getElementById('vrBtn').addEventListener('click', () => {
      vrMode = !vrMode;
      if (vrMode) {
        // 地面スレスレの一人称視点（千曲川沿い・上田市街）
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(138.2489, 36.4018, 2),
          orientation: {
            heading: Cesium.Math.toRadians(90),
            pitch: Cesium.Math.toRadians(0),
            roll: 0
          },
          duration: 2
        });
        document.getElementById('vrBtn').textContent = '🗺 俯瞰視点に戻る';
      } else {
        viewer.camera.flyTo({ ...DEFAULT_CAMERA, duration: 2 });
        document.getElementById('vrBtn').textContent = '👁 一人称視点（VR）';
      }
    });

  </script>
</body>
</html>
