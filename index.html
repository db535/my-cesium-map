<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>上田市 洪水シミュレーション Ultimate</title>

<script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
<link
href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css"
rel="stylesheet"
/>

<style>

html,body,#cesiumContainer{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:black;
    font-family:sans-serif;
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    width:320px;

    background:rgba(10,20,40,0.88);

    backdrop-filter:blur(10px);

    color:white;

    padding:18px;

    border-radius:14px;

    z-index:999;

    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

h2{
    margin:0 0 15px;
    color:#6cf;
}

#waterLevelDisplay{
    font-size:42px;
    font-weight:bold;
    color:#4af;
}

#danger{
    margin-top:6px;
    font-size:20px;
    font-weight:bold;
}

#waterSlider{
    width:100%;
    margin-top:12px;
}

button{
    width:100%;
    margin-top:8px;
    padding:10px;

    background:#183b5c;

    border:1px solid #4af;

    border-radius:8px;

    color:white;

    cursor:pointer;

    transition:0.2s;
}

button:hover{
    background:#285b88;
}

#status{
    margin-top:12px;
    font-size:12px;
    color:#aaa;
}

#fps{
    margin-top:8px;
    color:#8f8;
}

.legend{
    margin-top:15px;
    font-size:12px;
}

.legend div{
    margin-top:4px;
}

</style>
</head>

<body>

<div id="cesiumContainer"></div>

<div id="ui">

<h2>🌊 上田市 洪水シミュレーション</h2>

<div>
<span id="waterLevelDisplay">0.0</span> m
</div>

<input
type="range"
id="waterSlider"
min="0"
max="20"
step="0.1"
value="0"
/>

<div id="danger">安全</div>

<button id="playBtn">▶ 再生</button>
<button id="stopBtn">⏸ 停止</button>
<button id="resetBtn">↺ リセット</button>
<button id="vrBtn">👁 一人称モード</button>

<div id="fps">FPS: --</div>

<div class="legend">
<div>🟦 0.5m 床下浸水</div>
<div>🟦 1m 床上浸水</div>
<div>🟦 2m 1階水没</div>
<div>🟦 5m 2階水没</div>
<div>🟦 5m超 壊滅</div>
</div>

<div id="status">初期化中...</div>

</div>

<script type="module">

// ======================================
// Cesium Token
// ======================================

Cesium.Ion.defaultAccessToken =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI3MzM4NTMxNi0yYzYwLTRiN2ItYTIzYi0zNzJmZGFhODM5YjMiLCJpZCI6NDI0NjU3LCJpYXQiOjE3NzczNjI0NjZ9.aE_eNCYaVxPso_bdxpBmdSlEt_N0QJH_sa7gXwfZYT8';


// ======================================
// Viewer
// ======================================

const viewer = new Cesium.Viewer(
    'cesiumContainer',
    {

    terrain: Cesium.Terrain.fromWorldTerrain(),

    timeline:false,
    animation:false,

    baseLayerPicker:false,
    navigationHelpButton:false,

    geocoder:false,

    sceneModePicker:false
});


// ======================================
// Scene Settings
// ======================================

viewer.scene.globe.enableLighting = true;

viewer.scene.globe.depthTestAgainstTerrain = true;

viewer.scene.highDynamicRange = true;

viewer.scene.postProcessStages.fxaa.enabled = true;

viewer.shadows = true;

viewer.scene.globe.terrainExaggeration = 1.6;


// ======================================
// OSM Buildings
// ======================================

try{

    const osmBuildings =
        await Cesium.createOsmBuildingsAsync();

    viewer.scene.primitives.add(osmBuildings);

}catch(e){

    console.log("OSM Buildings 読み込み失敗");

}


// ======================================
// Camera
// ======================================

const DEFAULT_CAMERA = {

    destination:
        Cesium.Cartesian3.fromDegrees(
            138.249,
            36.401,
            15000
        ),

    orientation:{

        heading:0,

        pitch:
            Cesium.Math.toRadians(-60),

        roll:0
    }
};

viewer.camera.flyTo(DEFAULT_CAMERA);


// ======================================
// GeoJSON Files
// ======================================

const geojsonFiles = [

'A31-20-21_8404030903.geojson',
'A31-20-21_8404030001.geojson',
'A31-20-21_8404030643.geojson',
'A31-20-21_8404030649.geojson',
'A31-20-21_8404030669.geojson',
'A31-20-21_8404030677.geojson',
'A31-20-21_8404030690.geojson',
'A31-20-21_8404030693.geojson',
'A31-20-21_8404030696.geojson',
'A31-20-21_8404030698.geojson',
'A31-20-21_8404030700.geojson',
'A31-20-21_8404030904.geojson',
'A31-20-21_8404030909.geojson',
'A31-20-21_8404030913.geojson',
'A31-20-21_8404030922.geojson',
'A31-20-21_8404030923.geojson',
'A31-20-21_8404030938.geojson',
'A31-20-21_8404030963.geojson',
'A31-20-21_8404030966.geojson',
'A31-20-21_8404031041.geojson',

];


// ======================================
// Water Color
// ======================================

function waterColor(depth){

    if(depth < 0.5)
        return Cesium.Color.CYAN.withAlpha(0.7);

    if(depth < 1)
        return Cesium.Color.DEEPSKYBLUE.withAlpha(0.72);

    if(depth < 2)
        return Cesium.Color.BLUE.withAlpha(0.74);

    if(depth < 5)
        return Cesium.Color.DARKBLUE.withAlpha(0.78);

    return Cesium.Color.NAVY.withAlpha(0.85);
}


// ======================================
// Depth Map
// ======================================

const depthMap = {

    1:0.3,
    2:0.75,
    3:1.5,
    4:3.5,
    5:7.5
};


// ======================================
// Data Load
// ======================================

const allEntities = [];

const status =
    document.getElementById('status');

let loaded = 0;

for(const file of geojsonFiles){

    try{

        const ds =
            await Cesium.GeoJsonDataSource.load(
                `./data/${file}`
            );

        for(const entity of ds.entities.values){

            if(!entity.polygon)
                continue;

            const code =
                entity.properties
                ?.A31_205
                ?.getValue() ?? 1;

            const depth =
                depthMap[code] ?? 1;

            entity.polygon.material =
                waterColor(depth);

            entity.polygon.outline = false;

            entity.polygon.heightReference =
                Cesium.HeightReference.CLAMP_TO_GROUND;

            entity.polygon.extrudedHeightReference =
                Cesium.HeightReference.RELATIVE_TO_GROUND;

            entity.polygon.extrudedHeight =
                new Cesium.ConstantProperty(0);

            entity.polygon.perPositionHeight =
                false;

            entity.show = false;

            allEntities.push({

                entity,
                maxDepth:depth
            });
        }

        viewer.dataSources.add(ds);

        loaded++;

        status.textContent =
            `読み込み中 ${loaded}/${geojsonFiles.length}`;

    }catch(e){

        console.error(file,e);

    }
}

status.textContent =
`✅ ${allEntities.length}件の浸水データ`;


// ======================================
// UI
// ======================================

const slider =
    document.getElementById('waterSlider');

const display =
    document.getElementById('waterLevelDisplay');

const danger =
    document.getElementById('danger');


// ======================================
// Danger Level
// ======================================

function getDanger(level){

    if(level < 0.5)
        return ['安全','#8f8'];

    if(level < 1)
        return ['注意','#ff8'];

    if(level < 2)
        return ['危険','#fa4'];

    if(level < 5)
        return ['避難','#f44'];

    return ['壊滅','#f0f'];
}


// ======================================
// Flood Update
// ======================================

function updateFlood(level){

    display.textContent =
        level.toFixed(1);

    const d =
        getDanger(level);

    danger.textContent =
        d[0];

    danger.style.color =
        d[1];

    for(const obj of allEntities){

        const e =
            obj.entity;

        if(level <= 0){

            e.show = false;

            continue;
        }

        e.show = true;

        const h =
            Math.min(
                level,
                obj.maxDepth
            );

        e.polygon.extrudedHeight =
            new Cesium.ConstantProperty(h);
    }
}


// ======================================
// Slider
// ======================================

slider.addEventListener(
    'input',
    ()=>{

    updateFlood(
        parseFloat(slider.value)
    );

});


// ======================================
// Play
// ======================================

let interval = null;

document
.getElementById('playBtn')
.addEventListener('click',()=>{

    if(interval) return;

    interval = setInterval(()=>{

        let v =
            parseFloat(slider.value);

        v += 0.03;

        if(v >= 20){

            v = 20;

            clearInterval(interval);

            interval = null;
        }

        slider.value = v;

        updateFlood(v);

    },30);

});


// ======================================
// Stop
// ======================================

document
.getElementById('stopBtn')
.addEventListener('click',()=>{

    clearInterval(interval);

    interval = null;
});


// ======================================
// Reset
// ======================================

document
.getElementById('resetBtn')
.addEventListener('click',()=>{

    clearInterval(interval);

    interval = null;

    slider.value = 0;

    updateFlood(0);
});


// ======================================
// First Person
// ======================================

let firstPerson = false;

document
.getElementById('vrBtn')
.addEventListener('click',()=>{

    firstPerson = !firstPerson;

    if(firstPerson){

        const carto =
            Cesium.Cartographic
            .fromDegrees(
                138.249,
                36.401
            );

        const ground =
            viewer.scene.globe
            .getHeight(carto) || 0;

        viewer.camera.flyTo({

            destination:
                Cesium.Cartesian3
                .fromDegrees(
                    138.249,
                    36.401,
                    ground + 1.7
                ),

            orientation:{

                heading:
                    Cesium.Math
                    .toRadians(90),

                pitch:0,

                roll:0
            },

            duration:2
        });

    }else{

        viewer.camera.flyTo({
            ...DEFAULT_CAMERA,
            duration:2
        });
    }
});


// ======================================
// WASD Move
// ======================================

const keys = {};

window.addEventListener(
    'keydown',
    e=>{
        keys[e.key.toLowerCase()] = true;
});

window.addEventListener(
    'keyup',
    e=>{
        keys[e.key.toLowerCase()] = false;
});

viewer.clock.onTick
.addEventListener(()=>{

    if(!firstPerson)
        return;

    const speed =
        keys['shift'] ? 4 : 1.5;

    if(keys['w'])
        viewer.camera.moveForward(speed);

    if(keys['s'])
        viewer.camera.moveBackward(speed);

    if(keys['a'])
        viewer.camera.moveLeft(speed);

    if(keys['d'])
        viewer.camera.moveRight(speed);

});


// ======================================
// FPS
// ======================================

let frames = 0;

let last = performance.now();

function fpsLoop(){

    frames++;

    const now =
        performance.now();

    if(now - last >= 1000){

        document
        .getElementById('fps')
        .textContent =
            `FPS: ${frames}`;

        frames = 0;

        last = now;
    }

    requestAnimationFrame(fpsLoop);
}

fpsLoop();


// ======================================
// Initial
// ======================================

updateFlood(0);

</script>
</body>
</html>
